<section id="auth-login-section" class="auth-section">

    <div class="auth-card">

        <form id="login-form-element">

            <label>Email</label>
            <input type="email" id="login-email" placeholder="Inserisci email" required>

            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" id="login-password" placeholder="Inserisci password" required>
                <button type="button" id="toggle-password" class="toggle-password-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>

            <div id="login-error" class="error-msg"></div>

            <button type="submit" id="btn-login" class="auth-btn-primary">
                Lorem Ipsum
            </button>

            <button type="button" id="btn-register" class="auth-btn-secondary">
                Lorem Ipsum
            </button>

            <a href="#" class="auth-link">
                Lorem Ipsum
            </a>

        </form>

    </div>

</section>
