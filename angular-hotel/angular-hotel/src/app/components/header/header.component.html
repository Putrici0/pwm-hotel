<header class="header" [class.menu-open]="menuOpen">
  <a class="logo-container" routerLink="/" (click)="closeMenu()">
    <div class="logo-mark">ID</div>
    <div class="hotel-name">Isla Dorada</div>
  </a>

  <div class="main-action-container">
    <a class="btn btn-primary btn-small" routerLink="/booking" (click)="closeMenu()">
      Reserva ahora
    </a>
  </div>

  <button class="header-menu-toggle" type="button" (click)="toggleMenu()" aria-label="Abrir menú">
    <span class="header-menu-toggle__line"></span>
    <span class="header-menu-toggle__line"></span>
    <span class="header-menu-toggle__line"></span>
  </button>

  <div class="header-menu-backdrop" (click)="closeMenu()"></div>

  <nav class="nav-menu">
    <button class="header-menu-close mobile-only" type="button" (click)="closeMenu()" aria-label="Cerrar menú">
      ✕
    </button>

    <ul class="nav-list">
      <li class="mobile-only">
        <a class="nav-link" routerLink="/booking" (click)="closeMenu()">Reserva ahora</a>
      </li>

      <li>
        <a class="nav-link" routerLink="/rooms" (click)="closeMenu()">Habitaciones</a>
      </li>

      <li class="dropdown-item" [class.dropdown-open]="servicesDropdownOpen">
        <div class="dropdown-trigger">
          <a class="nav-link" href="#" (click)="toggleServicesDropdown($event)">Servicios</a>
          <button class="dropdown-toggle" type="button" (click)="toggleServicesDropdown($event)">▾</button>
        </div>

        <ul class="dropdown-menu">
          <li><a routerLink="/restaurant" (click)="closeMenu()">Restauración</a></li>
          <li><a routerLink="/wellness-facilities" (click)="closeMenu()">Bienestar</a></li>
          <li><a routerLink="/activities" (click)="closeMenu()">Actividades</a></li>
        </ul>
      </li>

      <li>
        <a class="nav-link" routerLink="/contact" (click)="closeMenu()">Contacto</a>
      </li>

      <li>
        <a class="nav-link" routerLink="/legal" (click)="closeMenu()">Legal</a>
      </li>

      <li class="dropdown-item" [class.dropdown-open]="accountDropdownOpen">
        <div class="dropdown-trigger">
          <a class="nav-link" href="#" (click)="toggleAccountDropdown($event)">Tu cuenta</a>
          <button class="dropdown-toggle" type="button" (click)="toggleAccountDropdown($event)">▾</button>
        </div>

        <ul class="dropdown-menu dropdown-right">
          @if (!showLogout) {
            <li><a [routerLink]="accountRoute" (click)="closeMenu()">Login</a></li>
            <li><a routerLink="/register" (click)="closeMenu()">Crea tu cuenta</a></li>
            <li><a routerLink="/change-password" (click)="closeMenu()">Recupera tu contraseña</a></li>
          } @else {
            <li><a href="#" (click)="logout($event)">Log out</a></li>
          }
        </ul>
      </li>
    </ul>
  </nav>
</header>
