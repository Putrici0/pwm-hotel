<app-header></app-header>

<section class="activities-page wrapper container-fluid">
  <div class="page-header">
    <h1>Actividades</h1>
    <p>
      El hotel incorpora propuestas que complementan la estancia y permiten combinar descanso con
      experiencias de ocio, bienestar y descubrimiento del entorno.
    </p>
  </div>

  <div class="cards-grid row g-4">
    <article class="activity-card card h-100 col-12 col-md-6 col-xl-4" *ngFor="let activity of activities">
      <img [src]="activity.imageUrl" [alt]="activity.title" />
      <div class="activity-card__body card-body">
        <h2>{{ activity.title }}</h2>
        <p>{{ activity.description }}</p>
        <span class="badge rounded-pill text-bg-light border">{{ activity.duration }}</span>
      </div>
    </article>
  </div>
</section>

<app-footer></app-footer>
