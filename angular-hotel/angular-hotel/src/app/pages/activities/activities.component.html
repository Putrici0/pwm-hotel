<app-header></app-header>

<section class="activities-page wrapper">
  <div class="page-header">
    <h1>Actividades</h1>
    <p>
      El hotel incorpora propuestas que complementan la estancia y permiten combinar descanso con
      experiencias de ocio, bienestar y descubrimiento del entorno.
    </p>
  </div>

  <div class="cards-grid">
    <article class="activity-card" *ngFor="let activity of activities">
      <img [src]="activity.imageUrl" [alt]="activity.title" />
      <div class="activity-card__body">
        <h2>{{ activity.title }}</h2>
        <p>{{ activity.description }}</p>
        <span>{{ activity.duration }}</span>
      </div>
    </article>
  </div>
</section>

<app-footer></app-footer>
