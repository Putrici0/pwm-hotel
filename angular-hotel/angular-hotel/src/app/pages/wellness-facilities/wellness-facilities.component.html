<app-header></app-header>

<section class="wellness-page wrapper">
  <div class="page-header">
    <h1>Wellness</h1>
    <p>
      El área wellness refuerza la dimensión de descanso del hotel y aporta espacios que
      complementan la experiencia del huésped.
    </p>
  </div>

  <div class="cards-grid">
    <article class="facility-card" *ngFor="let item of facilities">
      <img [src]="item.imageUrl" [alt]="item.title" />
      <div class="facility-card__body">
        <h2>{{ item.title }}</h2>
        <p>{{ item.description }}</p>
      </div>
    </article>
  </div>
</section>

<app-footer></app-footer>
