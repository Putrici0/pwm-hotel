<app-header></app-header>

<main *ngIf="accountData as data">
  <app-title-subtitle [title]="data.title.title" [description]="data.title.description"></app-title-subtitle>

  <section id="table-card-section" class="table-card-section">
    <div class="table-card-container">
      <h2 class="table-card__title">{{ data.table.title }}</h2>

      <div class="table-card">
        <div class="table-card__row table-card__header">
          <div>{{ data.table.headers.reservation }}</div>
          <div>{{ data.table.headers.checkin }}</div>
          <div>{{ data.table.headers.checkout }}</div>
        </div>

        <div class="table-card__row" *ngFor="let reservation of reservations">
          <div>{{ reservation.id }}</div>
          <div>{{ reservation.checkin }}</div>
          <div>{{ reservation.checkout }}</div>
        </div>
      </div>
    </div>
  </section>

  <section class="account-actions">
    <button id="change-1-account" class="account-actions__btn">{{ data.actions.buttons[0] }}</button>
    <button id="change-2-account" class="account-actions__btn">{{ data.actions.buttons[1] }}</button>
    <button id="change-3-account" class="account-actions__btn" (click)="goToChangePassword()">
      {{ data.actions.buttons[2] }}
    </button>
  </section>
</main>

<app-footer></app-footer>
