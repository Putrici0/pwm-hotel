<section class="image-grid-section">
  <ion-text><h2>{{ sectionData.title }}</h2></ion-text>

  <ion-grid class="image-grid">
    <ion-row>
      <ion-col size="12" sizeMd="4" *ngFor="let item of sectionData.items">
        <ion-card
          class="image-grid__item"
          [style.background]="item.imageGradient"
          [style.cursor]="item.imageLink ? 'pointer' : 'default'"
          (click)="goTo(item.imageLink)"
        >
          <ion-card-header>
            <ion-card-title>{{ item.title }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <p>{{ item.description }}</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</section>
