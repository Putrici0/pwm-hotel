<app-header></app-header>

<ion-content [fullscreen]="true">
  <div class="favorites-page" *ngIf="vm$ | async as vm">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/"></ion-back-button>
      </ion-buttons>
      <ion-title>Mis favoritos</ion-title>
    </ion-toolbar>

    <ion-list lines="full" *ngIf="vm.favorites.length > 0">
      <ion-item *ngFor="let dish of vm.favorites" [routerLink]="['/restaurant', dish.id]" detail="true">
        <ion-label>{{ dish.title }}</ion-label>
        <ion-badge color="danger">
          <ion-icon name="heart"></ion-icon>
          Favorito
        </ion-badge>
      </ion-item>
    </ion-list>

    <p class="empty">{{ vm.favorites.length === 0 ? 'Aun no tienes platos favoritos.' : '' }}</p>
  </div>
  <app-footer></app-footer>
</ion-content>
