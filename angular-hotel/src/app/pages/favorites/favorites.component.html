<app-header></app-header>

<div class="favorites-page">
  <h1>Mis favoritos</h1>

  <ul class="favorite-list" *ngIf="favorites$ | async as favorites">
    <li *ngFor="let dish of favorites">
      <a [routerLink]="['/dish-page', dish.id]">{{ dish.title }}</a>
    </li>
    <p class="empty" *ngIf="favorites.length === 0">
      Aun no tienes platos favoritos.
    </p>
  </ul>
</div>

<app-footer></app-footer>
