<app-header></app-header>

<ion-content [fullscreen]="true">
  <section class="activities-page wrapper container-fluid">
    <div class="page-header">
      <ion-text><h1>Actividades</h1></ion-text>
      <ion-text>
        <p>
          El hotel incorpora propuestas que complementan la estancia y permiten combinar descanso con
          experiencias de ocio, bienestar y descubrimiento del entorno.
        </p>
      </ion-text>
    </div>

    <div class="activity-list" *ngIf="activities$ | async as activities">
      <ion-card class="activity-list-item" *ngFor="let activity of activities">
        <img [src]="activity.imageUrl" [alt]="activity.title" class="zoomable-img" (click)="openImageModal(activity.imageUrl)" referrerpolicy="no-referrer" />
        <ion-card-header class="activity-list-item__body">
          <ion-card-title>{{ activity.title }}</ion-card-title>
        </ion-card-header>
        <ion-card-content class="activity-list-item__body">
          <p>{{ activity.description }}</p>
          <div>
            <span class="activity-badge">{{ activity.duration }}</span>
          </div>
        </ion-card-content>
      </ion-card>
    </div>
  </section>

  <ion-modal [isOpen]="!!selectedImageModal" (didDismiss)="closeImageModal()">
    <ng-template>
      <div class="image-modal-content">
        <ion-button type="button" class="image-modal-close" fill="clear" (click)="closeImageModal()">x</ion-button>
        <img [src]="selectedImageModal" *ngIf="selectedImageModal" alt="Vista ampliada">
      </div>
    </ng-template>
  </ion-modal>
  <app-footer></app-footer>
</ion-content>
