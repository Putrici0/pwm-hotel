<app-header></app-header>

<section class="services-page wrapper">
  <div class="page-header">
    <h1>Servicios</h1>
    <p>
      Isla Dorada Hotel articula su propuesta alrededor de servicios que mejoran la comodidad del
      huésped y aportan valor a la experiencia global de alojamiento.
    </p>
  </div>

  <div class="cards-grid">
    <a class="service-card" *ngFor="let item of services" [routerLink]="item.route" style="text-decoration: none; color: inherit; display: block; cursor: pointer;">
      <img [src]="item.imageUrl" [alt]="item.title" referrerpolicy="no-referrer" />
      <div class="service-card__body">
        <h2>{{ item.title }}</h2>
        <p>{{ item.description }}</p>

        <div style="margin-top: 1rem; color: var(--mar-navy); font-weight: bold; text-decoration: underline;">
          Descubrir más
        </div>
      </div>
    </a>
  </div>
</section>

<app-footer></app-footer>
