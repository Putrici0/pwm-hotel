<app-header></app-header>

<ion-content [fullscreen]="true">
<main *ngIf="changeData$ | async as changeData">
  <section id="forget-password-section" class="auth-section">
    <div class="auth-card">
      <form id="reset-flow-form">
        <div id="step-1" [style.display]="step === 1 ? 'block' : 'none'">
          <h2>{{ changeData.step1.title }}</h2>
          <p>{{ changeData.step1.description }}</p>
          <label>{{ changeData.step1.labelEmail }}</label>
          <input
            type="email"
            id="reset-email"
            [placeholder]="changeData.step1.placeholderEmail"
            [(ngModel)]="targetEmail"
            name="targetEmail"
            required
          />
          <div id="reset-error-1" class="error-msg" *ngIf="error1">{{ error1 }}</div>
          <button type="button" id="btn-step-1" class="auth-btn-primary" style="margin-top: 1rem" (click)="submitStep1()">
            {{ changeData.step1.btnText }}
          </button>
        </div>

        <div id="step-2" [style.display]="step === 2 ? 'block' : 'none'">
          <h2>{{ changeData.step2.title }}</h2>
          <p>{{ changeData.step2.description }}</p>
          <label>{{ changeData.step2.labelCode }}</label>
          <input
            type="text"
            id="reset-code"
            [placeholder]="changeData.step2.placeholderCode"
            maxlength="6"
            [(ngModel)]="code"
            name="code"
            required
          />
          <div id="reset-error-2" class="error-msg" *ngIf="error2">{{ error2 }}</div>
          <button type="button" id="btn-step-2" class="auth-btn-primary" style="margin-top: 1rem" (click)="submitStep2()">
            {{ changeData.step2.btnText }}
          </button>
        </div>

        <div id="step-3" [style.display]="step === 3 ? 'block' : 'none'">
          <h2>{{ changeData.step3.title }}</h2>
          <p>{{ changeData.step3.description }}</p>

          <label>{{ changeData.step3.labelPass1 }}</label>
          <div class="password-wrapper">
            <input
              [type]="showPass1 ? 'text' : 'password'"
              id="reset-pass-1"
              [placeholder]="changeData.step3.placeholderPass1"
              [(ngModel)]="pass1"
              name="pass1"
              required
            />
            <button type="button" id="toggle-reset-1" class="toggle-password-btn" (click)="showPass1 = !showPass1">
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <label>{{ changeData.step3.labelPass2 }}</label>
          <div class="password-wrapper">
            <input
              [type]="showPass2 ? 'text' : 'password'"
              id="reset-pass-2"
              [placeholder]="changeData.step3.placeholderPass2"
              [(ngModel)]="pass2"
              name="pass2"
              required
            />
            <button type="button" id="toggle-reset-2" class="toggle-password-btn" (click)="showPass2 = !showPass2">
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <div id="reset-error-3" class="error-msg" *ngIf="error3">{{ error3 }}</div>
          <button type="button" id="btn-step-3" class="auth-btn-primary" style="margin-top: 1rem" (click)="submitStep3()">
            {{ changeData.step3.btnText }}
          </button>
        </div>
      </form>
    </div>
  </section>
</main>
  <app-footer></app-footer>
</ion-content>
