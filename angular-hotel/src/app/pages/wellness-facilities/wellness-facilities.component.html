<app-header></app-header>

<section class="wellness-page wrapper container-fluid">
  <div class="page-header">
    <h1>Wellness</h1>
    <p>
      El área wellness refuerza la dimensión de descanso del hotel y aporta espacios que
      complementan la experiencia del huésped.
    </p>
  </div>

  <div class="cards-grid row g-4" *ngIf="facilities$ | async as facilities">
    <article class="facility-card card h-100 col-12 col-md-6 col-xl-4" *ngFor="let item of facilities">
      <img [src]="item.imageUrl" [alt]="item.title" referrerpolicy="no-referrer" />
      <div class="facility-card__body card-body">
        <h2>{{ item.title }}</h2>
        <p>{{ item.description }}</p>
      </div>
    </article>
  </div>
</section>

<app-footer></app-footer>
