<app-header></app-header>

<section class="wellness-page wrapper container-fluid">
  <div class="page-header">
    <h1>Wellness</h1>
    <p>
      El área wellness refuerza la dimensión de descanso del hotel y aporta espacios que
      complementan la experiencia del huésped.
    </p>
  </div>

  <div class="facility-list" *ngIf="facilities$ | async as facilities">
    <article class="facility-list-item" *ngFor="let item of facilities">
      <img [src]="item.imageUrl" [alt]="item.title" class="zoomable-img" (click)="openImageModal(item.imageUrl)" referrerpolicy="no-referrer" />
      <div class="facility-list-item__body">
        <h2>{{ item.title }}</h2>
        <p>{{ item.description }}</p>
      </div>
    </article>
  </div>
</section>

<div class="image-modal-overlay" [class.active]="!!selectedImageModal" (click)="closeImageModal()">
  <div class="image-modal-content" (click)="$event.stopPropagation()">
    <button type="button" class="image-modal-close" (click)="closeImageModal()">&times;</button>
    <img [src]="selectedImageModal" *ngIf="selectedImageModal" alt="Vista ampliada">
  </div>
</div>

<app-footer></app-footer>
