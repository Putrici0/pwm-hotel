<app-header></app-header>

<ion-content [fullscreen]="true">
  <div class="restaurant-page">
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>

    <ion-text class="intro">
      <p>Toca un plato para ver sus detalles. Puedes marcarlo como favorito con el corazon.</p>
    </ion-text>

    <div class="actions">
      <ion-button fill="clear" routerLink="/favorites" class="favorites-link">Ver mis favoritos</ion-button>
    </div>

    <ion-list class="dish-list" *ngIf="dishes$ | async as dishes" lines="full">
      <ion-item class="dish-item" *ngFor="let dish of dishes" [routerLink]="['/dish-page', dish.id]" detail="true">
        <ion-label class="dish-link">{{ dish.title }}</ion-label>
        <ion-button type="button" class="fav-btn" fill="clear" slot="end" (click)="toggleFavorite(dish, $event)">
          <ion-icon [name]="isFavorite(dish) ? 'heart' : 'heart-outline'"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-list>
  </div>
  <app-footer></app-footer>
</ion-content>
