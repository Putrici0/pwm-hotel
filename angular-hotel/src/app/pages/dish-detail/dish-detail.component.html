<app-header></app-header>

<ion-content [fullscreen]="true">
  <div class="detail-page" *ngIf="vm$ | async as vm">
    <ng-container *ngIf="vm.dish as dish; else notFound">
    <ion-toolbar>
      <ion-title>Detalle del plato</ion-title>
    </ion-toolbar>

    <a routerLink="/restaurant" class="back-link">
      <ion-icon name="arrow-back"></ion-icon>
      Volver a la carta
    </a>

    <h1>{{ dish.title }}</h1>
    <img *ngIf="dish.imageUrl" [src]="dish.imageUrl" [alt]="dish.title" referrerpolicy="no-referrer" />
    <p>{{ dish.description || 'Sin descripcion disponible.' }}</p>
    <p><strong>Categoria:</strong> {{ dish.category || 'Sin categoria' }}</p>

    <ion-button *ngIf="canUseFavorites()" color="danger" (click)="toggleFavorite(dish.id)">
      <ion-icon slot="start" [name]="vm.isFavorite ? 'heart' : 'heart-outline'"></ion-icon>
      {{ vm.isFavorite ? 'Quitar favorito' : 'Anadir a favoritos' }}
    </ion-button>
    </ng-container>
  </div>

  <ng-template #notFound>
    <div class="detail-page">
      <p>No se encontro el plato.</p>
      <a routerLink="/restaurant">Volver</a>
    </div>
  </ng-template>
  <app-footer></app-footer>
</ion-content>
